<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Painted before React mounts, so a dark-theme reload never flashes white.
         Mirrors ThemeContext's contract: an explicit choice wins, otherwise the OS. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('airport-agent.theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) { /* private mode: fall back to the OS preference */ }
    </script>
