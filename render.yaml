# Render deployment: ONE service serving both the API and the React build.
#
# WHY NOT SERVERLESS: bts.py caches BTS responses in-process, and a cold function
# would re-pay the first fetch (~16s for a national ranking) on every request.
# Render runs one long-lived process, so that cost is paid once at boot.
#
# WHY ONE UVICORN WORKER: multiple workers would each hold a separate BTS cache,
# and every request here is I/O-bound on BTS anyway — async handling covers it.
services:
  - type: web
    name: airport-agent
    runtime: python
    plan: free
    # WHY NO npm HERE: frontend/dist is committed. Render's Python image is not
    # guaranteed to carry a Node new enough for vite, and a build that needs a
    # toolchain the runtime does not promise is a deploy that breaks on their
    # schedule, not ours. Cost: rebuild and commit dist after any UI change.
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: TRACE_DB
        value: /tmp/traces.db
      - key: TRACE_MAX_ROWS
        value: "2000"
      - key: TRACE_KEY
        sync: false      # set by hand in the dashboard; unset = no read API
